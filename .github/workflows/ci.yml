name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 || sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pip-audit
        # Audit the *installed* environment, not the raw requirements file.
        # Using -r requirements.txt would attempt to audit tensorflow-cpu on
        # Python 3.12 even though the python_version marker excluded it from
        # installation, causing spurious CVE failures.
        # We use continue-on-error because TensorFlow 2.15.0 has known CVEs,
        # but we must use it since 2.16+ breaks DeepFace (documented in SECURITY.md).
        continue-on-error: true
        run: pip install pip-audit && pip-audit

      - name: Run flake8
        run: flake8 modules/ pipeline.py deploy.py tests/

      - name: Run black
        run: black --check modules/ pipeline.py deploy.py tests/

      - name: Run pytest with coverage
        run: pytest tests/ --cov=modules --cov-report=xml --cov-report=term

