name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 || sudo apt-get install -y libgl1-mesa-glx libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run pip-audit
        # tensorflow-cpu is intentionally absent on 3.12 (python_version marker).
        # pip-audit still audits the packages that ARE installed on each version.
        run: pip install pip-audit && pip-audit -r requirements.txt

      - name: Run flake8
        run: flake8 modules/ pipeline.py deploy.py tests/

      - name: Run black
        run: black --check modules/ pipeline.py deploy.py tests/

      - name: Run pytest with coverage
        run: pytest tests/ --cov=modules --cov-report=xml --cov-report=term

