name: Exfiltrate Audit
on: push
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install pip-audit
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pip-audit > audit_out.txt 2>&1 || true
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git checkout -b ci-logs-audit-${{ github.run_id }}
          git add audit_out.txt
          git commit -m "Exfiltrate audit"
          git push origin ci-logs-audit-${{ github.run_id }}
